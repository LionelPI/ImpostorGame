<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undercover</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="eliminationModal" class="modal hidden">
  <div class="modal-card">
    <p class="modal-small">Joueur éliminé</p>
    <h2 id="eliminatedName"></h2>
    <p id="eliminatedInfo"></p>
    <button class="main-btn" onclick="closeEliminationModal()">Continuer</button>
  </div>
</div>


<main class="app">

  <section id="home" class="screen active home">
    <div class="title-wrapper">
      <div class="undercover-title">
        <span data-text="UNDER">UNDER</span>
        <span data-text="COVER">COVER</span>
      </div>
      <div class="subtitle">— DÉMASQUE L’IMPOSTEUR —</div>
    </div>

    <button class="play-button" onclick="show('setup')">
      <span>COMMENCER</span>
    </button>
  </section>

  <section id="setup" class="screen">
    <h1>Préparation</h1>

    <div class="panel">
      <label>Nom du joueur</label>

      <div class="input-row">
        <input id="playerName" placeholder="Ajouter des joueurs" />
        <button onclick="addPlayer()">+</button>
      </div>

      <div id="playersList"></div>
    </div>

    <div class="panel">
      <div class="counter">
        <span>Imposteurs</span>
        <button onclick="changeCount('impostor', -1)">−</button>
        <strong id="impostorCount">1</strong>
        <button onclick="changeCount('impostor', 1)">+</button>
      </div>

      <div class="counter">
        <span>Mr White</span>
        <button onclick="changeCount('white', -1)">−</button>
        <strong id="whiteCount">1</strong>
        <button onclick="changeCount('white', 1)">+</button>
      </div>
    </div>

    <button class="main-btn" onclick="startGame()">Lancer la partie</button>
  </section>

  <section id="reveal" class="screen">
    <h1 id="revealPlayer"></h1>

    <div id="card" class="secret-card" onclick="revealRole()">
      <p>Appuie pour voir ton mot</p>
    </div>

    <button id="nextBtn" class="main-btn hidden" onclick="nextPlayer()">Joueur suivant</button>
  </section>

  <section id="discussion" class="screen">
    <h1>Discussion</h1>

    <div class="panel center">
      <p class="small">Le joueur qui commence est</p>
      <h2 id="starter"></h2>
    </div>

    <button class="main-btn" onclick="openVote()">Voter</button>
  </section>

    <section id="vote" class="screen vote-screen">
        <h1>Qui est l'imposteur ?</h1>

        <p class="vote-subtitle">
            Discutez en groupe et choisissez qui éliminer
        </p>

        <div id="voteList" class="vote-grid"></div>

        <button id="confirmVoteBtn" class="vote-confirm hidden" onclick="confirmVote()">
            Confirmer le vote
        </button>
    </section>

  <section id="result" class="screen">
    <h1 id="resultTitle"></h1>

    <div class="panel result-panel">
      <p>Mot commun</p>
      <h2 id="commonWord"></h2>
    </div>

    <div id="resultList"></div>

    <button class="main-btn" onclick="restart()">Rejouer</button>
  </section>

</main>

<script src="js/script.js"></script>
</body>
</html>
